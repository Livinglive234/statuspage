# /etc/apache2/sites-available/statuspage.conf
# Replace example.com with your domain.
# Enable: sudo a2enmod proxy proxy_http ssl headers rewrite
#         sudo a2ensite statuspage.conf && sudo systemctl reload apache2
#
# Apache uses the first virtual host that matches a name. Your panel's
# vhost (panel.example.com) must load BEFORE this one. Files in
# sites-enabled load alphabetically, so name this file so it sorts after
# the panel's (for example zz-statuspage.conf).

<VirtualHost *:80>
    ServerName status.example.com
    ServerAlias *.example.com
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName status.example.com
    ServerAlias *.example.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/statuspage-wildcard/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/statuspage-wildcard/privkey.pem

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8081/ timeout=15
    ProxyPassReverse / http://127.0.0.1:8081/
    RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"
</VirtualHost>
