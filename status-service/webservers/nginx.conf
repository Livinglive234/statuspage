# /etc/nginx/sites-available/statuspage  (symlink into sites-enabled)
# Replace example.com with your domain. Exact names such as panel.example.com
# still win over this wildcard.

limit_req_zone $binary_remote_addr zone=statuspages:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name *.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;   # nginx 1.25.1+. On older versions delete this line and use: listen 443 ssl http2;
    server_name *.example.com;

    ssl_certificate     /etc/letsencrypt/live/statuspage-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/statuspage-wildcard/privkey.pem;

    location / {
        limit_req zone=statuspages burst=20 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 15s;
    }
}
